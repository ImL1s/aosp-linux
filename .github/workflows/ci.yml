name: AOSP Dual-OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Verify SELinux Policies & NEVERALLOW Rules
        run: |
          echo "Verifying linux_manager.te NEVERALLOW rules..."
          grep "neverallow linux_manager" system/sepolicy/private/linux_manager.te

      - name: Run Real E2E Test Suite (All Tiers)
        run: |
          python3 tests/e2e/runner.py --tier 1 --tier 2 --tier 3 --tier 4

      - name: Build Guest Bridge Agent (Strict ARM64 Target)
        run: |
          cd guest/bridge-agent
          cargo check --target aarch64-unknown-linux-gnu
